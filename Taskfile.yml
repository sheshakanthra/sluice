# SLUICE task runner. `task --list` shows everything.
# Commands must work in Git Bash and in Task's built-in shell interpreter on
# Windows: forward slashes, no bash-only features.
version: "3"

# Loaded if present (missing files are ignored). Copy .env.example to .env.
dotenv: [".env"]

vars:
  MODULE: github.com/sheshakanthra/sluice
  COMPOSE: docker compose -f deploy/compose.yml
  # Full stack = infra + app + swarm definitions (one project, one network).
  STACK: docker compose -f deploy/compose.yml -f deploy/compose.app.yml -f deploy/compose.rush.yml
  # Env profile for the full stack: deploy/env/<ENV>.env (rush is the only one so far).
  ENV: '{{.ENV | default "rush"}}'
  VERSION:
    sh: echo "${SLUICE_VERSION:-dev}"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  # sqlc runs from its pinned image so nobody needs a local (cgo) install.
  SQLC_IMAGE: sqlc/sqlc:1.31.1
  SQLC: docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src/db {{.SQLC_IMAGE}}
  LDFLAGS: -s -w -X {{.MODULE}}/internal/buildinfo.Version={{.VERSION}} -X {{.MODULE}}/internal/buildinfo.Commit={{.COMMIT}}

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ---------- infra ----------
  up:
    desc: "Start infra (Postgres, Redis, Prometheus, Grafana) and wait until healthy"
    cmds:
      - "{{.COMPOSE}} up -d --wait"
      - "{{.COMPOSE}} ps"

  down:
    desc: Stop infra (volumes are kept)
    cmds:
      - "{{.COMPOSE}} down"

  ps:
    desc: Show infra container status
    cmds:
      - "{{.COMPOSE}} ps"

  # ---------- Go ----------
  build:
    desc: Build the sluice binary into bin/
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/sluice{{exeExt}} ./cmd/sluice

  version:
    desc: Print the stamped version of a fresh build
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/sluice version

  dev:api:
    desc: Run the API locally on HTTP_ADDR (default :8080)
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/sluice api

  dev:worker:
    desc: "Run the worker locally: hold sweeper (SWEEPER_INTERVAL), Redis inventory loader, River jobs (webhooks, capture/void/refund, reconciler, audit cache), health/metrics on WORKER_HTTP_ADDR"
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/sluice worker

  gen:
    desc: "sqlc generate: db/queries + db/migrations -> internal/db/gen (Docker)"
    cmds:
      - "{{.SQLC}} generate"

  gen:check:
    desc: Fail if internal/db/gen is out of date with the queries/migrations (sqlc diff)
    cmds:
      - "{{.SQLC}} diff"

  # ---------- database ----------
  migrate:
    desc: Apply goose migrations, then River's (idempotent)
    cmds:
      - go run ./cmd/sluice migrate

  seed:
    desc: "Seed demo events (idempotent). Flags after --, e.g. task seed -- --event loadtest-big --capacity 50000"
    cmds:
      - go run ./cmd/sluice seed {{.CLI_ARGS}}

  db:psql:
    desc: Open psql in the Postgres container
    interactive: true
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U sluice -d sluice"

  lint:
    desc: golangci-lint v2 (linters + gofmt/goimports)
    cmds:
      - golangci-lint run ./...

  test:
    desc: All Go tests (integration tests need Docker running)
    cmds:
      # -p 2: at most two test binaries (each with its own PG/Redis
      # containers) at once; Docker Desktop on Windows flakes when every
      # package starts containers together. -timeout 20m: internal/orders
      # runs ~4-5 min (its rapid property test alone ~3-4 min).
      - go test -p 2 -timeout 20m {{.CLI_ARGS}} ./...

  test:short:
    desc: Unit tests only (skips testcontainers integration tests)
    cmds:
      - go test -short ./...

  test:race:
    desc: All Go tests under the race detector (needs cgo + gcc on Windows)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -p 2 -timeout 20m {{.CLI_ARGS}} ./...

  vuln:
    desc: govulncheck
    cmds:
      - govulncheck ./...

  # ---------- web ----------
  web:install:
    desc: Install web dependencies (frozen lockfile)
    cmds:
      - pnpm --dir web install --frozen-lockfile

  dev:web:
    desc: Next.js dev server on :3000
    cmds:
      - pnpm --dir web dev

  web:build:
    desc: Static export into web/out
    cmds:
      - pnpm --dir web build

  web:lint:
    desc: ESLint + Prettier check + TypeScript typecheck
    cmds:
      - pnpm --dir web lint
      - pnpm --dir web format:check
      - pnpm --dir web typecheck

  web:serve:
    desc: "Serve web/out like a static host (no API, so REPLAY mode) on :4173"
    cmds:
      - node web/scripts/serve-static.mjs 4173

  web:budget:
    desc: "JS budgets: framework + at most 50 KB app code per route (ADR 0012); run after web:build"
    cmds:
      - node web/scripts/js-budget.mjs --lazy

  e2e:
    desc: "Playwright E1-E5 + axe: web build, stack up, live tests, E3 with the short-TTL overlay, then replay tests"
    cmds:
      - task: web:build
      - task: stack:up
      - pnpm --dir web exec playwright test --project live --grep-invert @expiry
      - task: e2e:ttl
        vars: { OVERLAY: e3 }
      - defer: { task: e2e:ttl, vars: { OVERLAY: none } }
      - pnpm --dir web exec playwright test --project live --grep @expiry
      - pnpm --dir web exec playwright test --project replay

  e2e:ttl:
    internal: true
    desc: "Recreate the API replicas and worker with env overlay rush.<OVERLAY>.env (none = plain rush)"
    env:
      SLUICE_ENV: "{{.ENV}}"
      SLUICE_SCENARIO: "{{.OVERLAY}}"
      SLUICE_VERSION: "{{.VERSION}}"
      SLUICE_COMMIT: "{{.COMMIT}}"
    cmds:
      - "{{.STACK}} up -d --wait --no-deps --force-recreate api1 api2 api3 worker"

  # ---------- later phases (stubs) ----------
  dev:mockpay:
    desc: "Run MockPay locally on MOCKPAY_HTTP_ADDR (default :8090); migrates its own database (MOCKPAY_DATABASE_URL) first"
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/sluice mockpay
  stack:up:
    desc: "Full stack behind Caddy on :8000 (ENV=rush by default): build the image, migrate, seed, 3x api, worker, mockpay, caddy; waits until healthy"
    env:
      SLUICE_ENV: "{{.ENV}}"
      SLUICE_VERSION: "{{.VERSION}}"
      SLUICE_COMMIT: "{{.COMMIT}}"
    preconditions:
      - sh: test -f deploy/env/{{.ENV}}.env
        msg: "deploy/env/{{.ENV}}.env does not exist (ENV=dev and ENV=demo profiles are not written yet; use ENV=rush)"
    cmds:
      - "{{.STACK}} build migrate"
      - "{{.STACK}} up -d --wait"
      - "{{.STACK}} ps"

  stack:down:
    desc: "Stop the full stack (volumes kept; task stack:down -- -v also deletes them)"
    env:
      SLUICE_ENV: "{{.ENV}}"
    cmds:
      - "{{.STACK}} --profile rush down {{.CLI_ARGS}}"

  rush:run:
    desc: "Ad-hoc swarm run against the running stack: seeds a fresh event, then sluice rush. Vars: USERS (2000), SCENARIO (SMOKE), CONN (pooled), OPENS_IN (30s), SEATS (500), EVENT (rush-<time>)"
    vars:
      USERS: '{{.USERS | default "2000"}}'
      SCENARIO: '{{.SCENARIO | default "SMOKE"}}'
      CONN: '{{.CONN | default "pooled"}}'
      OPENS_IN: '{{.OPENS_IN | default "30s"}}'
      SEATS: '{{.SEATS | default "500"}}'
      EVENT: '{{.EVENT | default (printf "rush-%s" (now | date "0102-150405"))}}'
    env:
      SLUICE_ENV: "{{.ENV}}"
    cmds:
      - "{{.STACK}} run --rm -T seed seed --event {{.EVENT}} --capacity {{.SEATS}} --opens-in 30m"
      - "{{.STACK}} run --rm -T rush --target http://caddy:8000 --event {{.EVENT}} --scenario {{.SCENARIO}} --users {{.USERS}} --conn {{.CONN}} --opens-in {{.OPENS_IN}} {{.CLI_ARGS}}"

  # ---------- the rush (LOADTEST.md) ----------
  # Every rush task: fresh stack (down -v) -> build -> migrate -> seed -> swarm
  # -> audit -> summary table. The task's exit code is the swarm/auditor's:
  # 0 pass, 1 invariant failed or unresolved users, 2 settle timed out.
  # B0 is EXPECTED to exit 1 (it proves the auditor catches oversells).
  # The stack is left running for inspection; `task stack:down -- -v` stops it.
  rush:scenario:
    internal: true
    vars:
      SCENARIO: '{{.SCENARIO | default "SMOKE"}}'
      OVERLAY: '{{.OVERLAY | default "none"}}'
      USERS: '{{.USERS | default "5000"}}'
      CONN: '{{.CONN | default "dedicated"}}'
      OPENS_IN: '{{.OPENS_IN | default "30s"}}'
      SEATS: '{{.SEATS | default "500"}}'
      EVENT: '{{.EVENT | default (printf "rush-%s" (now | date "0102-150405"))}}'
      RUN_ID: '{{.RUN_ID | default (printf "%s-%s" (lower .SCENARIO) (now | date "20060102-150405"))}}'
    env:
      SLUICE_ENV: "{{.ENV}}"
      SLUICE_SCENARIO: "{{.OVERLAY}}"
      SLUICE_VERSION: "{{.VERSION}}"
      SLUICE_COMMIT: "{{.COMMIT}}"
    cmds:
      - "{{.STACK}} --profile rush down -v --remove-orphans"
      - "{{.STACK}} build migrate"
      - "{{.STACK}} up -d --wait"
      - "{{.STACK}} run --rm -T seed seed --event {{.EVENT}} --capacity {{.SEATS}} --opens-in 30m"
      - "{{.STACK}} run --rm -T rush --target http://caddy:8000 --event {{.EVENT}} --scenario {{.SCENARIO}} --users {{.USERS}} --conn {{.CONN}} --opens-in {{.OPENS_IN}} --run-id {{.RUN_ID}} --audit {{.CLI_ARGS}}"

  rush:smoke:
    desc: "SMOKE: 5k users (USERS=...), waiting room on, correct system; then the audit. Must pass with every invariant 0"
    cmds:
      - task: rush:scenario
        vars: { SCENARIO: SMOKE, USERS: '{{.USERS | default "5000"}}', CONN: '{{.CONN | default "dedicated"}}' }
  rush:
    desc: "H (headline): 50k users (USERS=...), dedicated connections; then the audit. The canonical run is CI (P7)"
    cmds:
      - task: rush:scenario
        vars: { SCENARIO: H, USERS: '{{.USERS | default "50000"}}', CONN: '{{.CONN | default "dedicated"}}' }
  rush:b0:
    desc: "B0 naive baseline: 10k users (USERS=...), no waiting room, naive holds and payments. EXPECTED to fail the audit (exit 1)"
    cmds:
      - task: rush:scenario
        vars: { SCENARIO: B0, OVERLAY: b0, USERS: '{{.USERS | default "10000"}}', CONN: '{{.CONN | default "dedicated"}}' }
  rush:b1:
    desc: "B1 holds-only baseline: 10k users (USERS=...), correct holds, naive payments. Expect oversold 0 and duplicate charges > 0 (exit 1)"
    cmds:
      - task: rush:scenario
        vars: { SCENARIO: B1, OVERLAY: b1, USERS: '{{.USERS | default "10000"}}', CONN: '{{.CONN | default "dedicated"}}' }
  rush:b2:
    desc: "B2 direct: 10k users (USERS=...), the correct system without the waiting room. Must pass with every invariant 0"
    cmds:
      - task: rush:scenario
        vars: { SCENARIO: B2, OVERLAY: b2, USERS: '{{.USERS | default "10000"}}', CONN: '{{.CONN | default "dedicated"}}' }

  audit:
    desc: "Run the auditor against the running stack: EVENT=<slug> [RESULTS=<run_id>] [MODE=naive] (exit 0 pass, 1 fail, 2 settle timeout, 3 error)"
    requires:
      vars: [EVENT]
    env:
      SLUICE_ENV: "{{.ENV}}"
    cmds:
      - "{{.STACK}} run --rm -T audit --event {{.EVENT}} --mode {{.MODE | default \"normal\"}} {{if .RESULTS}}--results /results/{{.RESULTS}}{{end}} {{.CLI_ARGS}}"

  # ---------- k6 cross-checks (LOADTEST §5) ----------
  # Fresh stack, then grafana/k6 on the compose network. Results (k6 summary
  # JSON + HTML dashboard) land in loadtest/results/<run_id>/.
  k6:run:
    internal: true
    vars:
      RUN_ID: '{{.RUN_ID | default (printf "%s-%s" .NAME (now | date "20060102-150405"))}}'
      EVENT: '{{.EVENT | default (printf "%s-%s" .NAME (now | date "0102-150405"))}}'
    env:
      SLUICE_ENV: "{{.ENV}}"
      SLUICE_VERSION: "{{.VERSION}}"
      SLUICE_COMMIT: "{{.COMMIT}}"
    cmds:
      - "{{.STACK}} --profile rush down -v --remove-orphans"
      - "{{.STACK}} build migrate"
      - "{{.STACK}} up -d --wait"
      - "{{.STACK}} run --rm -T seed seed --event {{.EVENT}} --capacity {{.SEATS}} --opens-in 30m"
      - mkdir -p loadtest/results/{{.RUN_ID}}
      - >-
        docker run --rm --network sluice_default
        -v "{{.ROOT_DIR}}/loadtest:/loadtest"
        --env-file deploy/env/{{.ENV}}.env
        -e BASE=http://caddy:8000 -e EVENT={{.EVENT}} -e OUT=/loadtest/results/{{.RUN_ID}} {{.K6_ENV}}
        -e K6_WEB_DASHBOARD=true -e K6_WEB_DASHBOARD_EXPORT=/loadtest/results/{{.RUN_ID}}/k6.html
        grafana/k6:1.4.0 run --summary-export=/loadtest/results/{{.RUN_ID}}/k6-summary.json /loadtest/k6/{{.SCRIPT}}

  k6:spike:
    desc: "K1: k6 queue-join spike (ramping-arrival-rate to RATE=3000/s for 30 s; session + join per iteration)"
    cmds:
      - task: k6:run
        vars: { NAME: k1, SCRIPT: spike-queue.js, SEATS: "500", K6_ENV: '-e RATE={{.RATE | default "3000"}}' }
  k6:checkout:
    desc: "K2: k6 checkout capacity on a 50k-seat event: STEPS=200,... checkouts/s, STEP_S seconds each (default 200/s for 60 s)"
    cmds:
      - task: k6:run
        vars: { NAME: k2, SCRIPT: checkout.js, SEATS: "50000", K6_ENV: '-e STEPS={{.STEPS | default "200"}} -e STEP_S={{.STEP_S | default "60"}}' }
  chaos:
    desc: "TODO(P7) chaos suite"
    cmds: ["echo 'TODO(P7) - chaos is not implemented yet' && exit 1"]
  demo:
    desc: "TODO(P8) live demo stack"
    cmds: ["echo 'TODO(P8) - demo is not implemented yet' && exit 1"]
  tunnel:
    desc: "TODO(P8) Cloudflare quick tunnel"
    cmds: ["echo 'TODO(P8) - tunnel is not implemented yet' && exit 1"]
