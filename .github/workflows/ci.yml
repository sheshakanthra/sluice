name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  TASK_VERSION: 3.54.0

jobs:
  go:
    name: go (lint, race tests, govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Built from source with the repo's toolchain so the linter always
      # understands the Go version in go.mod.
      - name: Install golangci-lint and govulncheck
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}"
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"

      - name: Lint
        run: task lint

      # sqlc diff (pinned Docker image): generated code must match the queries.
      - name: sqlc up to date
        run: task gen:check

      # Includes testcontainers integration tests (Docker is available on ubuntu-latest).
      - name: Test (race)
        run: task test:race

      - name: govulncheck
        run: task vuln

      - name: Build (stamped)
        env:
          SLUICE_VERSION: ci-${{ github.run_number }}
        run: |
          task build
          ./bin/sluice version

  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Static export produced index.html
        run: test -f out/index.html
