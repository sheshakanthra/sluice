# The canonical rush (LOADTEST §7, ADR 0015): the full stack and the swarm on
# one ubuntu-latest runner, then the invariant audit. Manual trigger only.
# This workflow never commits, pushes or writes to the repository: its only
# outputs are the job summary and the uploaded results artifact.
name: rush

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario (LOADTEST §4): H headline, SMOKE, B0/B1 naive baselines, B2 direct"
        type: choice
        options: [H, SMOKE, B0, B1, B2]
        default: H
      users:
        description: "Simulated users (blank = scenario default: H 50000, SMOKE 5000, B0/B1/B2 10000)"
        type: string
        default: ""
      swarm_cpuset:
        description: "Pin only the swarm container to these CPUs, e.g. 0 or 0-1 (blank = not pinned; report.md discloses it when set)"
        type: string
        default: ""

permissions:
  contents: read

env:
  TASK_VERSION: 3.54.0
  SCENARIO: ${{ inputs.scenario }}
  USERS_INPUT: ${{ inputs.users }}
  # Read by deploy/compose.rush.yml (cpuset) and reported in summary.json.
  RUSH_CPUSET: ${{ inputs.swarm_cpuset }}
  # Reported in summary.json as env.runner.
  RUSH_RUNNER: github-actions-ubuntu-latest

jobs:
  rush:
    name: rush ${{ inputs.scenario }} ${{ inputs.users }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve run parameters
        id: params
        run: |
          case "$SCENARIO" in
            H)     task_name=rush;       default_users=50000 ;;
            SMOKE) task_name=rush:smoke; default_users=5000 ;;
            B0)    task_name=rush:b0;    default_users=10000 ;;
            B1)    task_name=rush:b1;    default_users=10000 ;;
            B2)    task_name=rush:b2;    default_users=10000 ;;
            *) echo "unknown scenario: $SCENARIO" >&2; exit 1 ;;
          esac
          users="${USERS_INPUT:-$default_users}"
          if ! [[ "$users" =~ ^[0-9]+$ ]] || [ "$users" -lt 1 ] || [ "$users" -gt 60000 ]; then
            echo "users must be an integer in 1..60000, got: $users" >&2
            exit 1
          fi
          if ! [[ "$RUSH_CPUSET" =~ ^[0-9,-]*$ ]]; then
            echo "swarm_cpuset must look like 0, 0-1 or 0,2; got: $RUSH_CPUSET" >&2
            exit 1
          fi
          run_id="ci-${GITHUB_RUN_ID}-${SCENARIO,,}-${users}"
          {
            echo "task=$task_name"
            echo "users=$users"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"

      # LOADTEST §7 step 2. 50k dedicated keep-alive connections need the
      # accept backlog, ephemeral ports and file descriptors.
      - name: Tune the host
        run: |
          sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 \
            net.ipv4.ip_local_port_range="1024 65535" net.ipv4.tcp_tw_reuse=1 fs.file-max=2000000

      # The rush and audit containers write results into this bind mount.
      # They run as the runner's uid/gid (compose.rush.yml reads SLUICE_UID
      # and SLUICE_GID), so the runner can read what they write. Caddy
      # mounts web/out (gitignored).
      - name: Prepare bind mounts
        run: |
          {
            echo "SLUICE_UID=$(id -u)"
            echo "SLUICE_GID=$(id -g)"
          } >> "$GITHUB_ENV"
          mkdir -p loadtest/results web/out
          chmod 0755 loadtest/results

      - name: Record the runner
        env:
          RUN_ID: ${{ steps.params.outputs.run_id }}
        run: |
          {
            echo "## Runner"
            echo '```'
            echo "nproc: $(nproc)"
            free -m
            uname -srm
            docker version --format 'docker {{.Server.Version}}'
            docker compose version
            echo "commit: ${GITHUB_SHA}"
            echo "run_id: ${RUN_ID}"
            echo "swarm_cpuset: ${RUSH_CPUSET:-not pinned}"
            echo '```'
          } | tee runner.md

      # LOADTEST §7 step 3. `task rush*` itself starts from a fresh stack
      # (down -v, up --wait with ENV=rush), seeds the event, runs the swarm
      # and then the auditor (`sluice rush --audit`).
      - name: Build images
        run: docker compose -f deploy/compose.yml -f deploy/compose.app.yml -f deploy/compose.rush.yml build

      # Per-container CPU for every rush (P8-h50k-fix F): the diagnosis of
      # run 45781258193 could not split CPU between the swarm and the stack.
      # Runs in the background until the stop step below.
      - name: Start the docker stats sampler
        run: |
          nohup bash loadtest/ci/dockerstats.sh "$PWD/docker-stats.csv" > /dev/null 2>&1 &
          echo $! > dockerstats.pid

      - name: Rush and audit
        id: rush
        env:
          TASK_NAME: ${{ steps.params.outputs.task }}
          USERS: ${{ steps.params.outputs.users }}
          RUN_ID: ${{ steps.params.outputs.run_id }}
        run: |
          set +e
          task "$TASK_NAME" ENV=rush USERS="$USERS" RUN_ID="$RUN_ID"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "sluice rush exited $code"
          # The verdict step decides pass/fail (baselines are expected to exit 1).
          exit 0

      - name: Stop the docker stats sampler
        if: always()
        run: |
          if [ -f dockerstats.pid ]; then kill "$(cat dockerstats.pid)" 2>/dev/null || true; fi

      # Belt and braces for the run-as-host-user setting above: whatever a
      # container wrote (any owner, any mode), the runner owns and can read it
      # before the summary, the verdict and the upload touch it.
      - name: Make results readable by the runner
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" loadtest/results && chmod -R a+rX loadtest/results

      - name: Collect stack logs and runner info
        if: always()
        env:
          RUN_ID: ${{ steps.params.outputs.run_id }}
        run: |
          dir="loadtest/results/$RUN_ID"
          mkdir -p "$dir"
          cp runner.md "$dir/runner.md"
          if [ -f docker-stats.csv ]; then
            gzip -c docker-stats.csv > "$dir/docker-stats.csv.gz"
            python3 loadtest/ci/cpu_summary.py docker-stats.csv > "$dir/cpu.md" || true
          fi
          docker compose -f deploy/compose.yml -f deploy/compose.app.yml -f deploy/compose.rush.yml \
            logs --no-color --timestamps > "$dir/stack.log" 2>&1 || true
          gzip -f "$dir/stack.log"
          docker compose -f deploy/compose.yml -f deploy/compose.app.yml -f deploy/compose.rush.yml ps -a > "$dir/ps.txt" 2>&1 || true
          # The swarm's own profiles (--pprof, ADR 0019) ride in the artifact;
          # their top goes next to them and into the job summary.
          if [ -f "$dir/cpu.pprof" ]; then
            go tool pprof -top -nodecount=25 "$dir/cpu.pprof" > "$dir/pprof-top.txt" 2>&1 || true
          fi

      # LOADTEST §7 step 6: public proof on the run page.
      - name: Job summary and verdict
        id: verdict
        if: always()
        env:
          RUN_ID: ${{ steps.params.outputs.run_id }}
          RUSH_EXIT: ${{ steps.rush.outputs.exit_code || '99' }}
        run: |
          set +e
          dir="loadtest/results/$RUN_ID"
          problems=()
          # Append a required file to the summary, or name why it can't be.
          section() {
            if [ ! -e "$1" ]; then
              problems+=("$1 was not written")
              echo "**Missing:** \`$1\` was not written."
            elif [ ! -r "$1" ]; then
              problems+=("$1 is not readable by $(id -un) ($(stat -c '%U:%G %a' "$1"))")
              echo "**Unreadable:** \`$1\` ($(stat -c '%U:%G %a' "$1"))."
            else
              cat "$1"
            fi
            echo
          }
          {
            section runner.md
            section "$dir/report.md"
            section "$dir/cpu.md"
            if [ -r "$dir/pprof-top.txt" ]; then
              echo "<details><summary>Swarm CPU profile (top 25; cpu.pprof and heap.pprof are in the artifact)</summary>"
              echo
              echo '```'
              cat "$dir/pprof-top.txt"
              echo '```'
              echo "</details>"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          python3 loadtest/ci/verdict.py "$dir" "$SCENARIO" "$RUSH_EXIT" > verdict.md
          code=$?
          cat verdict.md
          cat verdict.md >> "$GITHUB_STEP_SUMMARY"
          cp verdict.md "$dir/verdict.md" || problems+=("could not copy verdict.md into $dir")
          for p in "${problems[@]}"; do echo "::error::$p"; done
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if [ "${#problems[@]}" -gt 0 ]; then exit 1; fi
          exit 0

      # LOADTEST §7 step 5.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rush-${{ steps.params.outputs.run_id }}
          path: loadtest/results/${{ steps.params.outputs.run_id }}
          if-no-files-found: error
          retention-days: 90

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.app.yml -f deploy/compose.rush.yml --profile rush down -v --remove-orphans || true
