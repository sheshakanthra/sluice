global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The full stack (compose.app.yml) runs in-network; dev processes run on the
  # host (task dev:api / dev:worker / dev:mockpay). Whichever is not running
  # simply shows as down. The instance label is the service name.
  - job_name: sluice-api
    static_configs:
      - targets: ["api1:8080", "api2:8080", "api3:8080"]
        labels: { role: api }
      - targets: ["host.docker.internal:8080"]
        labels: { role: api, mode: dev }
  - job_name: sluice-worker
    static_configs:
      - targets: ["worker:9091"]
        labels: { role: worker }
      - targets: ["host.docker.internal:9091"]
        labels: { role: worker, mode: dev }
  - job_name: sluice-mockpay
    static_configs:
      - targets: ["mockpay:8090"]
        labels: { role: mockpay }
      - targets: ["host.docker.internal:8090"]
        labels: { role: mockpay, mode: dev }
  - job_name: caddy
    static_configs:
      - targets: ["caddy:9180"]
        labels: { role: edge }
