# The swarm (`sluice rush`) as a container on the stack's network, aimed at
# http://caddy:8000. It is behind the "rush" profile so `up` never starts it;
# run it with
#   docker compose -f deploy/compose.yml -f deploy/compose.app.yml -f deploy/compose.rush.yml \
#     run --rm -T rush --scenario SMOKE --event <slug> ...
name: sluice

services:
  rush:
    image: sluice:local
    profiles: ["rush"]
    entrypoint: ["/usr/local/bin/sluice", "rush"]
    # Results land in the ../loadtest/results bind mount: write them as the
    # host user so the host (the CI runner) can read and upload them. CI sets
    # SLUICE_UID/SLUICE_GID; elsewhere the image's nonroot user (65532) stays.
    user: "${SLUICE_UID:-65532}:${SLUICE_GID:-65532}"
    command: ["--target", "http://caddy:8000", "--scenario", "SMOKE"]
    env_file:
      - env/${SLUICE_ENV:-rush}.env
      - path: env/${SLUICE_ENV:-rush}.${SLUICE_SCENARIO:-none}.env
        required: false
    environment:
      RUSH_RESULTS_DIR: /results
      # `sluice rush --audit` / `sluice audit` read the datastores directly
      # (in-network hosts, as in compose.app.yml).
      DATABASE_URL: postgres://sluice:sluice@postgres:5432/sluice?sslmode=disable
      MOCKPAY_DATABASE_URL: postgres://sluice:sluice@postgres:5432/mockpay?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RUSH_RUNNER: ${RUSH_RUNNER:-local}
      RUSH_CPUSET: ${RUSH_CPUSET:-}
      # Reported in summary.json; keep in step with deploy/compose.yml.
      RUSH_PG_VERSION: "18.7"
      RUSH_REDIS_VERSION: "8.10.3"
    # Optional pinning (ADR 0015 addendum): RUSH_CPUSET="0" keeps the swarm on
    # CPU 0; empty (the default) leaves it unpinned. Only the swarm is
    # pinned; report.md says so whenever it is set.
    cpuset: "${RUSH_CPUSET:-}"
    # 50k dedicated connections to one destination need ~64k source ports
    # and as many file descriptors (LOADTEST §1).
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    volumes:
      - ../loadtest/results:/results
    depends_on:
      caddy:
        condition: service_healthy
    restart: "no"

  # The auditor (LOADTEST §6) on the same network: settles the stack, then
  # checks every invariant. Run it with
  #   ... run --rm -T audit --event <slug> --results /results/<run_id> [--mode naive]
  audit:
    image: sluice:local
    profiles: ["rush"]
    entrypoint: ["/usr/local/bin/sluice", "audit"]
    # Writes audit.json into the results bind mount; same rule as rush.
    user: "${SLUICE_UID:-65532}:${SLUICE_GID:-65532}"
    env_file:
      - env/${SLUICE_ENV:-rush}.env
      - path: env/${SLUICE_ENV:-rush}.${SLUICE_SCENARIO:-none}.env
        required: false
    environment:
      DATABASE_URL: postgres://sluice:sluice@postgres:5432/sluice?sslmode=disable
      MOCKPAY_DATABASE_URL: postgres://sluice:sluice@postgres:5432/mockpay?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUDIT_API: http://caddy:8000
    volumes:
      - ../loadtest/results:/results
    depends_on:
      caddy:
        condition: service_healthy
    restart: "no"
