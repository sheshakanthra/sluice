# sqlc config. Run through `task gen` (pinned Docker image, no local install).
version: "2"
sql:
  - engine: postgresql
    schema: migrations       # goose files; sqlc ignores the Down sections
    queries: queries
    gen:
      go:
        package: gen
        out: ../internal/db/gen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  - engine: postgresql
    schema: ../internal/mockpay/migrations
    queries: ../internal/mockpay/queries
    gen:
      go:
        package: mpdb
        out: ../internal/mockpay/mpdb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
