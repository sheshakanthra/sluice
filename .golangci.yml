version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over a few bytes per struct
        - shadow # `err` shadowing is idiomatic
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam # config structs are passed by pointer where it matters
        - unnamedResult
        - whyNoLint # each nolint already carries a reason
    gosec:
      excludes:
        - G104 # duplicate of errcheck
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: early-return
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    paths:
      - internal/db/gen
      - web
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sheshakanthra/sluice
  exclusions:
    paths:
      - internal/db/gen
